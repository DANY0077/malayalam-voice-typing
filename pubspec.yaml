name: malayalam_voice_typing
description: AI Voice Typing for Malayalam - Turns natural speech into clean, properly punctuated, and formatted text
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Voice recognition
  speech_to_text: ^6.6.0
  
  # Audio recording
  record: ^5.0.4
  permission_handler: ^11.3.0
  
  # Clipboard
  clipboard: ^0.1.3
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # HTTP for cloud API (optional)
  http: ^1.2.0
  
  # JSON
  json_annotation: ^4.8.1
  
  # Path provider
  path_provider: ^2.1.2
  
  # Vibration feedback
  vibration: ^1.8.4
  
  # Share
  share_plus: ^7.2.2
  
  # Local notifications (for background)
  flutter_local_notifications: ^17.1.2
  
  # Background fetch
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/